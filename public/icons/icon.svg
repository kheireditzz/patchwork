<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep luxury dark canvas -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Outer Rim Glow Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="45%" stop-color="#06b6d4" />
      <stop offset="85%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Vibrant Gradient for the Letter P -->
    <linearGradient id="pGrad" x1="15%" y1="10%" x2="90%" y2="95%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#34d399" />
      <stop offset="70%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Inner Accent Shadow / 3D Bevel -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.2" />
    </linearGradient>

    <!-- Crown / Sparkle Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Drop Shadow Filter for Letter P -->
    <filter id="pGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#10b981" flood-opacity="0.38" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Outer Squircle Container with Sleek Border -->
  <rect x="16" y="16" width="480" height="480" rx="128" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="128" fill="none" stroke="url(#rimGrad)" stroke-width="6" opacity="0.85" />

  <!-- Subtle Ambient Glow Behind Letter P -->
  <circle cx="256" cy="240" r="160" fill="#10b981" opacity="0.12" filter="blur(32px)" />

  <!-- Geometric Modern 'P' Letterform -->
  <g filter="url(#pGlow)">
    <!-- Main P Silhouette: Clean, Bold, Aerodynamic curves with perfect readability at 16x16 / 32x32 tab size -->
    <path 
      d="M 164 108
         L 282 108
         C 346 108, 396 154, 396 218
         C 396 282, 346 328, 282 328
         L 236 328
         L 236 404
         L 164 404
         Z
         M 236 172
         L 236 264
         L 278 264
         C 308 264, 328 244, 328 218
         C 328 192, 308 172, 278 172
         Z" 
      fill="url(#pGrad)" 
      fill-rule="evenodd"
    />

    <!-- Diagonal Dynamic Sheen on the P Stem for Modern Depth -->
    <path
      d="M 164 108
         L 236 108
         L 236 404
         L 164 404
         Z"
      fill="url(#accentGrad)"
      opacity="0.4"
    />

    <!-- Subtle Modern Notch / Accent dot representing digital affiliate connectivity -->
    <circle cx="236" cy="404" r="8" fill="#34d399" opacity="0.8" />
  </g>

  <!-- Elegant Signature Star / Crown Diamond in Top-Right Corner of P -->
  <g filter="url(#softShadow)">
    <path 
      d="M 382 104 
         L 392 124 
         L 412 134 
         L 392 144 
         L 382 164 
         L 372 144 
         L 352 134 
         L 372 124 
         Z" 
      fill="url(#goldGrad)" 
    />
  </g>
</svg>
